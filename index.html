<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotenLernApp</title>
  <style>
    :root { --bg: #faf7f2; --fg: #2b2620; --accent: #b5651d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1a17; --fg: #eee7dd; --accent: #e09a5a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2.2rem; margin: 0 0 .5rem; }
    h1 span { color: var(--accent); }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>🎸 Noten<span>Lern</span>App</h1>
    <p>Hier entsteht meine App zum Gitarre lernen und Notenlesen üben.</p>
    <p>Bald gibt es hier Übungen zu Noten, Griffbrett und Rhythmus.</p>
  </main>
</body>
</html>
